schemaVersion: '2.0.0'

commandTests:
  - name: 'PHP libcurl includes TLS shutdown fix'
    command: "php"
    args: ["-r", 'exit(version_compare(curl_version()["version"], "8.22.0", ">=") ? 0 : 1);']
    exitCode: 0
  - name: 'PHP is 8.5.13 or newer (OPcache fix for php-src GH-24577)'
    command: "php"
    args: ["-r", 'exit(PHP_VERSION_ID >= 80513 ? 0 : 1);']
    exitCode: 0
  - name: 'No ImageMagick'
    command: "sh"
    args: ["-c", "! command -v magick && ! command -v identify && ! php -m | grep -qi imagick"]
    exitCode: 0
  - name: 'rsync command'
    command: "rsync"
    args: ["--version"]
    expectedOutput: ["rsync  version 3.*"]
  - name: 'Certbot command'
    command: "certbot"
    args: ["--version"]
    expectedOutput: ["certbot 5.*"]
  - name: 'Docker command'
    command: "docker"
    args: ["--version"]
    expectedOutput: ["Docker version 29.*"]
  - name: 'Docker Compose command'
    command: "docker"
    args: ["compose", "version"]
    expectedOutput: ["Docker Compose version v.*"]
  - name: 'Git command'
    command: "git"
    args: ["--version"]
    expectedOutput: ["git version 2.*"]
  - name: 'Entire git remote helper'
    command: "git-remote-entire"
    args: ["--version"]
    expectedOutput: ["git-remote-entire 0\\.[0-9]+\\.[0-9]+"]
  - name: 'ExifTool command'
    command: "exiftool"
    args: ["-ver"]
    expectedOutput: ["13\\.[0-9]+"]
  - name: 'PHP modules'
    command: "php"
    args: ["-m"]
    expectedOutput:
      - brotli
      - Core
      - ctype
      - curl
      - date
      - dom
      - fileinfo
      - filter
      - gd
      - hash
      - iconv
      - igbinary
      - intl
      - json
      - libxml
      - lz4
      - maxminddb
      - mbstring
      - mysqlnd
      - openssl
      - pcre
      - PDO
      - pdo_mysql
      - pdo_pgsql
      - pdo_sqlite
      - Phar
      - posix
      - protobuf
      - random
      - readline
      - redis
      - Reflection
      - scrypt
      - session
      - SimpleXML
      - snappy
      - sockets
      - sodium
      - SPL
      - sqlite3
      - standard
      - swoole
      - tokenizer
      - xml
      - xmlreader
      - xmlwriter
      - yaml
      - zlib
      - zstd
  - name: 'XDebug absent'
    command: "php"
    args: ["-m"]
    excludedOutput:
      - xdebug
  - name: 'PHP GD supported formats'
    command: "php"
    args: ["-i"]
    expectedOutput:
      - "AVIF Support => enabled"
      - "FreeType Support => enabled"
      - "JPEG Support => enabled"
      - "PNG Support => enabled"
      - "WebP Support => enabled"
  - name: 'PHP version'
    command: "php"
    args: ["-v"]
    expectedOutput:
      - "PHP 8.5.* (cli)*"
  - name: 'libheif decodes HEIC and AVIF, and encodes AVIF'
    command: "sh"
    args: ["-c", "ls /usr/lib/libheif/ | tr '\\n' ' '"]
    expectedOutput:
      - "libde265"
      - "dav1d"
      - "aomenc"
  - name: 'PHP intl'
    command: "php"
    args: ["-r", 'print(\Normalizer::FORM_D);']
    expectedOutput:
      - "4"
  - name: 'Swoole version'
    command: "php"
    args: ["--re", "swoole"]
    expectedOutput:
      - '.*swoole version 6\.[0-9]+\.[0-9]+ .*'
  - name: 'ZIP'
    command: "zip"
    args: ["-v"]
    expectedOutput:
      - "Zip 3.0 \\(July 5th 2008\\)"
